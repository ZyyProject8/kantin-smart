version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: kantin_user
      POSTGRES_PASSWORD: kantin_pass
      POSTGRES_DB: kantin_db
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kantin_user"]
      interval: 5s
      retries: 5

volumes:
  db_data:
